name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # Only source is needed for patch compatibility tests; no phone/signing setup.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: appium/WebDriverAgent
          ref: 3d6a4e03cdd673e540289c610f7e189f8ffea434
          path: vendor/WebDriverAgent
          persist-credentials: false
          sparse-checkout: WebDriverAgentLib/Commands
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: test "$(git -C vendor/WebDriverAgent rev-parse HEAD)" = "$(cat scripts/wda-revision)"
      - run: bun run verify
