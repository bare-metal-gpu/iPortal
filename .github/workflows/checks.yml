name: Checks

on:
  workflow_dispatch:
    inputs:
      simulator_only:
        description: Run only the simulator checks after an already verified commit
        type: boolean
        default: false
      skip_simulator:
        description: Skip the iOS simulator for host-only changes (manual runs only)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || !inputs.simulator_only
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run verify
      # Protocol parsing tests need no paired device or private Apple framework.
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.95.0 fmt --manifest-path native/Cargo.toml --check
      - run: cargo +1.95.0 test --manifest-path native/Cargo.toml --locked
      - run: cargo +1.95.0 clippy --manifest-path native/Cargo.toml --all-targets --locked -- -D warnings

  simulator:
    if: github.event_name != 'workflow_dispatch' || inputs.simulator_only || !inputs.skip_simulator
    # The pinned iOS dependencies need Swift 6.4. Keep verify on macos-15
    # separately so new SDK-only references in the Mac code remain detectable.
    runs-on: xcode-27
    env:
      # Do not silently inherit the image's older default XCTest driver.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      # Keep the functional baseline reproducible across hosted image updates.
      IPORTAL_SIMULATOR_RUNTIME: "26.5"
    # Includes a cold native build and real XCTest observations on a hosted Mac.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Report the selected Apple toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - run: bun install --frozen-lockfile
      - name: Install the functional-test runtime
        run: xcodebuild -downloadPlatform iOS -buildVersion "$IPORTAL_SIMULATOR_RUNTIME" -architectureVariant arm64
      # Build the owned iOS 17+ runner and exercise real XCTest against our fixture.
      - run: bun run test:simulator
      - name: Retain controlled simulator failure screenshot
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: simulator-failure
          path: vendor/simulator-diagnostics/failure.png
          if-no-files-found: ignore
          retention-days: 3
