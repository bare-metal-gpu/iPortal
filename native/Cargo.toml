[package]
name = "iportal-native-media"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Only protocol framing. Pairing, trust and tunnel establishment belong to Apple's
# CoreDevice client; this crate never reads pairing keys or opens a LAN listener.
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "89702099f4d7552f704f93b4526756abda319ceb", default-features = false, features = [
  "ring",
  "display_stream",
] }
plist = "1.10.3"
tokio = { version = "1.53", features = ["io-util", "net", "rt", "sync", "time", "macros"] }
uuid = { version = "1.29", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
